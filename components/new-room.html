<p class="eyebrow">$t('create.kicker')</p>
<h2>$t('create.title')</h2>
<p class="muted">$t('create.description')</p>
<form id="create-room-form">
    <div class="field">
        <label for="new-room-name">$t('create.name')</label>
        <input id="new-room-name" maxlength="100" required
            autocomplete="off" placeholder="$t('create.placeholder')">
    </div>
    <div class="divider"></div>
    <button class="btn dark" type="submit">$t('create.submit')</button>
</form>
